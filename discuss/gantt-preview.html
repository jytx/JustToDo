<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>甘特图时间线视图 - 效果预览</title>
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --surface-sunken: #F4F4F0;
    --border: #E8E8E3;
    --text: #1F1F1F;
    --text-2: #6B6B6B;
    --text-3: #9CA3AF;
    --primary: #4F46E5;
    --accent-soft: #EEF2FF;
    --p-high: #EF4444;
    --p-mid: #F59E0B;
    --p-low: #3B82F6;
    --p-none: #9CA3AF;
    --today-line: #4F46E5;
    --weekend: #F8F8F4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    font-size: 13px;
  }
  .preview-note {
    background: #FEF3C7;
    border: 1px solid #FCD34D;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 12px;
    color: #92400E;
    max-width: 1100px;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
    border-bottom: none;
    max-width: 1100px;
  }
  .toolbar__nav { display: flex; align-items: center; gap: 4px; }
  .toolbar__btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .toolbar__btn:hover { background: var(--surface-sunken); }
  .toolbar__btn--active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .toolbar__title { font-weight: 600; font-size: 15px; min-width: 140px; }
  .toolbar__spacer { flex: 1; }
  .toolbar__hint { color: var(--text-3); font-size: 11px; }

  .gantt {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0 0 10px 10px;
    overflow: hidden;
    max-width: 1100px;
  }
  .gantt__tasks {
    width: 200px;
    flex-shrink: 0;
    border-right: 2px solid var(--border);
    background: var(--surface);
  }
  .gantt__tasks-head {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
    color: var(--text-3);
    border-bottom: 1px solid var(--border);
    background: var(--surface-sunken);
    font-weight: 600;
  }
  .gantt__task-row {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .gantt__task-row:hover { background: var(--surface-sunken); }
  .gantt__task-row--selected { background: var(--accent-soft); }
  .gantt__task-check {
    width: 14px; height: 14px;
    border: 1.5px solid var(--text-3);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .gantt__task-check--done { background: var(--primary); border-color: var(--primary); position: relative; }
  .gantt__task-check--done::after {
    content: '✓'; color: #fff; font-size: 9px;
    position: absolute; top: -2px; left: 2px;
  }
  .gantt__task-prio { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .gantt__task-name {
    font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gantt__task-name--done { color: var(--text-3); text-decoration: line-through; }

  .gantt__timeline { flex: 1; overflow-x: auto; position: relative; }
  .gantt__dates {
    display: flex;
    height: 56px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-sunken);
    position: sticky; top: 0; z-index: 2;
  }
  .gantt__date {
    flex-shrink: 0; width: 52px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-right: 1px solid var(--border);
    font-size: 11px; color: var(--text-2);
  }
  .gantt__date--weekend { background: var(--weekend); }
  .gantt__date--today { background: var(--accent-soft); color: var(--primary); font-weight: 700; }
  .gantt__date-day { font-size: 14px; font-weight: 600; }
  .gantt__date-weekday { font-size: 10px; color: var(--text-3); margin-top: 2px; }

  .gantt__grid { position: relative; }
  .gantt__grid-row {
    height: 40px; display: flex;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .gantt__grid-cell {
    width: 52px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    height: 100%;
  }
  .gantt__grid-cell--weekend { background: var(--weekend); }
  .gantt__grid-cell--today { background: rgba(79, 70, 229, 0.04); }

  .gantt__today-line {
    position: absolute; top: 0; bottom: 0;
    width: 2px; background: var(--today-line);
    z-index: 3; pointer-events: none;
  }
  .gantt__today-line::before {
    content: ''; position: absolute;
    top: -1px; left: -4px;
    width: 10px; height: 10px;
    background: var(--today-line); border-radius: 50%;
  }

  .gantt__bar {
    position: absolute; top: 6px; height: 28px;
    border-radius: 6px;
    display: flex; align-items: center;
    padding: 0 8px;
    font-size: 11px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: grab; z-index: 1;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    transition: box-shadow 0.12s;
  }
  .gantt__bar:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .gantt__bar:active { cursor: grabbing; }
  .gantt__bar--p-high { background: var(--p-high); }
  .gantt__bar--p-mid { background: var(--p-mid); }
  .gantt__bar--p-low { background: var(--p-low); }
  .gantt__bar--p-none { background: var(--p-none); }
  .gantt__bar--done { opacity: 0.5; }
  .gantt__bar::after, .gantt__bar::before {
    content: ''; position: absolute;
    top: 0; bottom: 0; width: 4px;
    cursor: ew-resize; opacity: 0;
    transition: opacity 0.12s;
  }
  .gantt__bar::before { left: 0; border-radius: 6px 0 0 6px; background: rgba(0,0,0,0.15); }
  .gantt__bar::after { right: 0; border-radius: 0 6px 6px 0; background: rgba(0,0,0,0.15); }
  .gantt__bar:hover::before, .gantt__bar:hover::after { opacity: 1; }

  .unscheduled {
    margin-top: 20px; max-width: 1100px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .unscheduled__title { font-size: 12px; color: var(--text-3); margin-bottom: 10px; font-weight: 600; }
  .unscheduled__list { display: flex; flex-wrap: wrap; gap: 8px; }
  .unscheduled__chip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px; cursor: grab;
  }
  .unscheduled__chip:hover { border-color: var(--primary); }
  .unscheduled__chip-prio { width: 7px; height: 7px; border-radius: 50%; }

  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 16px; font-size: 11px; color: var(--text-3);
    max-width: 1100px;
  }
  .legend__item { display: flex; align-items: center; gap: 5px; }
  .legend__dot { width: 10px; height: 10px; border-radius: 3px; }
</style>
</head>
<body>

<div class="preview-note">
  📋 甘特图时间线视图静态预览（模拟数据）。交互：拖横条中间平移改日期 / 拖左右边缘改时长 / 点击横条看详情 / 点击空白建任务 / 底部未排期任务可拖入安排。
</div>

    <div class="gantt__task-row">

  </div>

  <div class="gantt__timeline">

      <div class="gantt__date gantt__date--today"><span class="gantt__date-day">3</span><span class="gantt__date-weekday">今天</span></div>
      <div class="gantt__date"><span class="gantt__date-day">4</span><span class="gantt__date-weekday">周一</span></div>

      <div class="gantt__date gantt__date--weekend"><span class="gantt__date-day">8</span><span class="gantt__date-weekday">周五</span></div>
      <div class="gantt__date gantt__date--weekend"><span class="gantt__date-day">9</span><span class="gantt__date-weekday">周六</span></div>
      <div class="gantt__date"><span class="gantt__date-day">10</span><span class="gantt__date-weekday">周日</span></div>
      <div class="gantt__date"><span class="gantt__date-day">11</span><span class="gantt__date-weekday">周一</span></div>
      <div class="gantt__date"><span class="gantt__date-day">12</span><span class="gantt__date-weekday">周二</span></div>
    </div>

    <div class="gantt__grid">
      <div class="gantt__today-line" style="left: 130px;"></div>

      <div class="gantt__grid-row">
        <div class="gantt__grid-cell"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell gantt__grid-cell--today"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div>
        <div class="gantt__bar gantt__bar--p-high" style="left: 104px; width: 100px;">项目评审会议</div>
      </div>

      <div class="gantt__grid-row">
        <div class="gantt__grid-cell"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell gantt__grid-cell--today"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div>
        <div class="gantt__bar gantt__bar--p-low" style="left: 156px; width: 48px;">客户拜访</div>
      </div>

      <div class="gantt__grid-row">
        <div class="gantt__grid-cell"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell gantt__grid-cell--today"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell gantt__grid-cell--weekend"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div><div class="gantt__grid-cell"></div>

<div class="legend">
  <div class="legend__item"><div class="legend__dot" style="background:var(--p-high)"></div>高优先级</div>
  <div class="legend__item"><div class="legend__dot" style="background:var(--p-mid)"></div>中优先级</div>
  <div class="legend__item"><div class="legend__dot" style="background:var(--p-low)"></div>低优先级</div>
  <div class="legend__item"><div class="legend__dot" style="background:var(--p-none)"></div>无优先级</div>
  <div class="legend__item"><div class="legend__dot" style="background:var(--primary); width:3px; height:14px;"></div>今日线</div>
</div>

<div class="unscheduled">
  <div class="unscheduled__title">📋 未排期任务（拖到上方时间线即可安排日期）</div>
  <div class="unscheduled__list">
    <div class="unscheduled__chip"><div class="unscheduled__chip-prio" style="background:var(--p-high)"></div>紧急修复 Bug</div>
    <div class="unscheduled__chip"><div class="unscheduled__chip-prio" style="background:var(--p-mid)"></div>重构支付模块</div>

  </div>
</div>

</body>
</html>
